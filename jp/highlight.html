    <style>
                :root {
                        --sidebar-w: 220px;
                        --sidebar-mobile-w: 70px;
                        --bottom-bar-h: 64px;
                        --page-max-w: 800px;
                        --page-pad: 20px;
                        --radius: 12px;
                        --muted: #6b7280;
                        --accent: #ff2b8a;
                        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;

                html, body {
                        height: 100%;

                        background: #fff;
                        color: #0f172a;

        }

                    html.site-sidebar-collapsed {
                            --sidebar-w: var(--sidebar-collapsed-w);

        }

                site-sidebar:not(:defined) {
                        display: none;

        }

                site-sidebar {
                        position: fixed;
                        left: 0;
                        top: 0;
                        bottom: 0;
                        width: var(--sidebar-w);
                        z-index: 60;

        }

        body {
                padding-bottom: calc(var(--bottom-bar-h) + 12px);
                box-sizing: border-box;
                transition: padding-left 0.3s ease;

        }


                main {
                        display: block;
                        width: 100%;

        }

                .container {
                        max-width: var(--page-max-w);
                        margin: 40px auto;
                        padding: var(--page-pad);
                        box-sizing: border-box;
                        text-align: center;

        }

                .card {
                        background: #fff;
                        border-radius: var(--radius);
                        padding: 24px;
                        box-shadow: 0 6px 18px rgba(15,23,42,0.05);
                        border: 1px solid rgba(15,23,42,0.04);
                        margin-bottom: 20px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;

        }

                h1 {
                        margin: 0 0 12px 0;
                        font-size: 1.6rem;
                        color: var(--accent);

        }

                h2 {
                        margin: 0 0 10px 0;
                        font-size: 1.2rem;

        }

                p.lead {
                        margin: 0 0 16px 0;
                        color: var(--muted);
                        font-size: 1.1rem;
                        line-height: 1.5;

        }

                .muted {
                        color: var(--muted);
                        font-size: 0.98rem;
                        line-height: 1.5;

        }


                ul {
                        margin: 12px 0 20px 0;
                        padding: 0;
                        color: var(--muted);
                        list-style-position: inside;
                        text-align: left;
                        display: inline-block;

        }

                a.link {
                        color: var(--accent);
                        text-decoration: none;
                        font-weight: 600;

        }

                .contact-list {
                        display: flex;
                        gap: 12px;
                        justify-content: center;
                        flex-wrap: wrap;
                        margin-top: 12px;

        }

                .inline-note {
                        font-size: 0.9rem;
                        color: var(--muted);
                        background: #f9fafb;
                        padding: 8px 12px;
                        border-radius: 8px;
                        display: inline-block;

        }




        @media (max-width: 720px) {
                .container {
                        margin-top: 20px;
                        padding: 15px;
                }
        }
